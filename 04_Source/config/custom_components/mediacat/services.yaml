resolve_media_record:
  name: Resolve media record
  description: Look up one item in the loaded schema-v3 MediaCat catalogue and return normalized MediaCat record version 1.
  fields:
    catalogue_id:
      name: Catalogue ID
      description: Exact identity of the loaded schema-v3 catalogue. Must match ^[a-z0-9][a-z0-9_-]*$.
      required: true
      example: curated_media
      selector:
        text:
    item_id:
      name: Item ID
      description: Item identifier within the requested catalogue. Must match ^[a-z0-9][a-z0-9_-]*$.
      required: true
      example: bbc_radio_2
      selector:
        text:
  response:
    optional: false
