resolve_media_record:
  name: Resolve media record
  description: Look up one item in the active MediaCat catalogue registry and return normalized MediaCat record version 1.
  fields:
    catalogue_id:
      name: Catalogue ID
      description: Exact identity of an active schema-v4 catalogue. Must match ^[a-z0-9][a-z0-9_-]*$.
      required: true
      example: curated_media
      selector:
        text:
    item_id:
      name: Item ID
      description: Item identifier within the requested catalogue. Must match ^[a-z0-9][a-z0-9_-]*$.
      required: true
      example: bbc_radio_2
      selector:
        text:
  response:
    optional: false

get_admin_capabilities:
  name: Get admin capabilities
  description: Return the supported catalogue schema versions, active catalogue IDs, storage convention, and available administration features.
  response:
    optional: false

validate_catalogue:
  name: Validate catalogue
  description: Validate one supplied catalogue YAML document without changing disk or active runtime state.
  fields:
    catalogue_yaml:
      name: Catalogue YAML
      description: Complete UTF-8 catalogue YAML document to validate.
      required: true
      selector:
        text:
          multiline: true
  response:
    optional: false

reload_catalogue:
  name: Reload catalogue registry
  description: Discover and validate every local catalogue file, then atomically replace the active registry only when the complete candidate is valid.
  response:
    optional: false
