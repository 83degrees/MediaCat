resolve_item:
  name: Resolve item
  description: Look up a Curated Media item by its canonical ID and return its complete catalogue record directly as the action response.
  fields:
    item_id:
      name: Item ID
      description: Stable canonical item identifier matching ^[a-z0-9][a-z0-9_-]*$.
      required: true
      example: bbc_radio_2
      selector:
        text:
  response:
    optional: false

resolve_media_record:
  name: Resolve media record
  description: Look up one item in the loaded schema-v3 Curated Media catalogue and return normalized MediaCat record version 1. This action is separate from the legacy raw-item resolve_item action.
  fields:
    catalogue_id:
      name: Catalogue ID
      description: Exact identity of the loaded schema-v3 catalogue.
      required: true
      example: curated_media
      selector:
        text:
    item_id:
      name: Item ID
      description: Item identifier within the requested catalogue.
      required: true
      example: bbc_radio_2
      selector:
        text:
  response:
    optional: false
